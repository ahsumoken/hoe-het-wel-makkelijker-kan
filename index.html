<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Simulatie van één burgeromgeving per levensgebied, als alternatief voor nóg een identiteitsapp.">
  <title>Hoe het wél makkelijker kan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231d5a8c'/%3E%3Cpath d='M12 4.5l6.5 3v5.2c0 4.1-2.9 6.2-6.5 7.5-3.6-1.3-6.5-3.4-6.5-7.5V7.5z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>

    :root {
      --bg: #f3f6fb;
      --bg-tint: #e8eef6;
      --surface: #ffffff;
      --ink: #152033;
      --ink-soft: #3d4a5c;
      --muted: #5c6b80;
      --line: #d8e0eb;
      --line-strong: #bec9d9;
      --brand: #1d5a8c;
      --brand-hover: #15486f;
      --brand-ink: #0f3a5c;
      --brand-soft: #e6f1f8;
      --brand-mid: #2a7ab0;
      --ok: #0b6b50;
      --ok-bg: #e4f5ee;
      --ok-line: #b7e0cc;
      --off: #5c6b80;
      --off-bg: #eef1f5;
      --warn: #8a4b12;
      --warn-bg: #f8efe4;
      --warn-line: #ecd4b5;
      --danger: #922b2b;
      --danger-bg: #fdeeee;
      --danger-line: #f0c7c7;
      --shadow: 0 1px 2px rgba(21, 32, 51, 0.05), 0 8px 24px rgba(21, 32, 51, 0.06);
      --shadow-soft: 0 1px 2px rgba(21, 32, 51, 0.04);
      --radius: 14px;
      --radius-sm: 10px;
      --header-h: 64px;
      --nav-h: 64px;
      --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      --mono: "ui-monospace", "SFMono-Regular", "Segoe UI Mono", Menlo, Consolas, monospace;
      --focus: 0 0 0 3px rgba(29, 90, 140, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font-family: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }
    a { color: var(--brand); }
    .skip {
      position: absolute; left: -999px; top: 0;
      background: var(--brand); color: #fff; padding: 8px 12px; z-index: 100;
    }
    .skip:focus { left: 8px; top: 8px; }
    .header {
      position: sticky; top: 0; z-index: 40; height: var(--header-h);
      display: flex; align-items: center; gap: 16px; padding: 0 20px;
      background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex; align-items: center; gap: 12px; min-width: 0;
      background: none; border: 0; padding: 0; color: inherit; text-align: left;
    }
    .logo {
      flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px;
      background: var(--brand); color: #fff; display: grid; place-items: center;
    }
    .brand-text { min-width: 0; }
    .brand-title {
      font-size: 16px; font-weight: 700; letter-spacing: -0.02em;
      line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .brand-sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .sim-tag {
      font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--brand); background: var(--brand-soft); border: 1px solid #c5ddec;
      border-radius: 999px; padding: 3px 8px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 10px; border: 1px solid transparent; padding: 8px 12px;
      font-size: 14px; font-weight: 600; line-height: 1.2;
      background: var(--surface); color: var(--ink);
      transition: background .15s, border-color .15s, color .15s;
    }
    .btn:focus-visible { outline: none; box-shadow: var(--focus); }
    .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink-soft); }
    .btn-ghost:hover { background: var(--bg-tint); border-color: var(--line-strong); }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-ok { background: var(--ok); color: #fff; }
    .btn-ok:hover { filter: brightness(0.95); }
    .btn-danger { background: transparent; border-color: var(--danger-line); color: var(--danger); }
    .btn-danger:hover { background: var(--danger-bg); }
    .btn-text { background: none; border: 0; color: var(--brand); padding: 4px 0; font-weight: 600; font-size: 14px; }
    .btn-text:hover { text-decoration: underline; }
    .btn-text.danger { color: var(--danger); }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
      padding: 3px 9px; font-size: 12px; font-weight: 650; line-height: 1.3;
    }
    .badge-ok { background: var(--ok-bg); color: var(--ok); }
    .badge-off { background: var(--off-bg); color: var(--off); }
    .badge-warn { background: var(--warn-bg); color: var(--warn); }
    .badge-count {
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
      background: var(--danger); color: #fff; font-size: 11px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-btn { position: relative; }
    .icon-btn .badge-count { position: absolute; top: -4px; right: -4px; }
    .page { max-width: 1280px; margin: 0 auto; padding: 20px 20px 40px; }
    @media (min-width: 901px) { .page { padding-bottom: 48px; } }
    @media (max-width: 900px) {
      .page { padding: 16px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }
      .header { padding: 0 14px; }
      .brand-sub { display: none; }
      .sim-tag { display: none; }
    }
    .intro {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow-soft); padding: 20px; position: relative;
    }
    .intro-lead {
      grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 16px; align-items: flex-start;
    }
    .intro-lead h2 { font-size: 20px; letter-spacing: -0.03em; margin-bottom: 6px; }
    .intro-lead p { color: var(--ink-soft); max-width: 70ch; }
    .intro-card { border-radius: var(--radius-sm); padding: 16px; border: 1px solid var(--line); }
    .intro-card.against { background: #faf7f4; border-color: var(--warn-line); }
    .intro-card.for { background: var(--brand-soft); border-color: #c5ddec; }
    .intro-card h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
    .intro-card.against h3 { color: var(--warn); }
    .intro-card.for h3 { color: var(--brand-ink); }
    .intro-card p, .intro-card li { font-size: 14px; color: var(--ink-soft); }
    .intro-card ul { margin: 0; padding-left: 18px; }
    .intro-card li { margin: 4px 0; }
    .principle {
      grid-column: 1 / -1; background: var(--ink); color: #fff; border-radius: var(--radius-sm);
      padding: 12px 16px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    }
    .principle span { font-weight: 500; opacity: 0.85; }
    .requests-wrap { margin-bottom: 20px; }
    .section-title {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 10px;
    }
    .section-title h2 { font-size: 15px; font-weight: 700; }
    .section-title p { font-size: 13px; color: var(--muted); }
    .request-list { display: grid; gap: 12px; }
    .request-card {
      background: var(--surface); border: 1px solid var(--warn-line); border-left: 4px solid #c57a2a;
      border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-soft);
    }
    .request-card h3 { font-size: 16px; margin-bottom: 4px; }
    .request-card .meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .request-card p.body { font-size: 14px; color: var(--ink-soft); margin-bottom: 12px; }
    .field-picks { display: grid; gap: 6px; margin: 0 0 14px; }
    .field-pick {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
      background: var(--bg); border: 1px solid var(--line); font-size: 14px;
    }
    .field-pick input { width: 16px; height: 16px; accent-color: var(--brand); }
    .field-pick .hint { margin-left: auto; font-size: 12px; color: var(--muted); }
    .request-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .empty-note {
      font-size: 14px; color: var(--muted); background: var(--surface);
      border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); padding: 14px 16px;
    }
    .simulate { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
    .shell {
      display: grid; grid-template-columns: 240px minmax(0, 1fr) 360px; gap: 16px;
      align-items: start; min-height: 520px;
    }
    .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow-soft); overflow: hidden;
    }
    .panel-h { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
    .panel-h h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; }
    .panel-h p { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .panel-h .title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .panel-h .org-name { font-size: 18px; letter-spacing: -0.02em; text-transform: none; color: var(--ink); font-weight: 700; }
    .sector-list { display: flex; flex-direction: column; padding: 8px; }
    .sector-btn {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      background: none; border: 0; border-radius: 10px; padding: 10px; color: var(--ink);
      font-size: 14px; font-weight: 600;
    }
    .sector-btn:hover { background: var(--bg); }
    .sector-btn:focus-visible { outline: none; box-shadow: var(--focus); }
    .sector-btn.active { background: var(--brand-soft); color: var(--brand-ink); }
    .sector-ico {
      width: 28px; height: 28px; border-radius: 8px; background: var(--bg-tint); color: var(--brand);
      display: grid; place-items: center; flex: 0 0 auto;
    }
    .sector-btn.active .sector-ico { background: #fff; }
    .sector-btn .count {
      margin-left: auto; font-size: 12px; font-weight: 700; color: var(--muted);
      background: var(--bg); border-radius: 999px; min-width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center; padding: 0 6px;
    }
    .sector-btn.active .count { background: #fff; color: var(--brand); }
    .org-list { display: flex; flex-direction: column; }
    .org-row {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; color: inherit;
    }
    .org-row:last-child { border-bottom: 0; }
    .org-row:hover { background: var(--bg); }
    .org-row:focus-visible { outline: none; box-shadow: inset var(--focus); }
    .org-row.active { background: var(--brand-soft); }
    .org-row .grow { flex: 1; min-width: 0; }
    .org-row .name { font-weight: 700; font-size: 15px; }
    .org-row .cta { font-size: 13px; color: var(--brand); font-weight: 600; white-space: nowrap; }
    .detail { padding: 0 0 16px; }
    .id-box {
      margin: 12px 16px; padding: 10px 12px; background: var(--bg); border-radius: 10px;
      border: 1px solid var(--line); font-size: 13px;
    }
    .id-box .lbl { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .id-box .val { font-family: var(--mono); font-weight: 700; font-size: 14px; letter-spacing: 0.02em; margin-top: 2px; }
    .notice {
      margin: 0 16px 12px; padding: 10px 12px; background: var(--brand-soft);
      border-radius: 10px; color: var(--brand-ink); font-size: 13px;
    }
    .subhead {
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); padding: 8px 16px 6px;
    }
    .toggle-row {
      display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center;
      padding: 10px 16px; border-top: 1px solid var(--line);
    }
    .toggle-row .lab { font-size: 15px; font-weight: 650; }
    .toggle-row .hint { grid-column: 1 / -1; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .toggle-row.bsn { background: var(--warn-bg); }
    .switch-wrap { display: flex; align-items: center; gap: 8px; }
    .switch-wrap .slbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
    .switch-wrap .slbl.on { color: var(--ok); }
    .switch-wrap .slbl.off-emph { color: var(--danger); }
    .switch {
      position: relative; width: 44px; height: 26px; border-radius: 999px; border: 0;
      background: #c5cdd8; padding: 0; flex: 0 0 auto;
    }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
      border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2);
      transition: transform .16s ease;
    }
    .switch[aria-checked="true"] { background: var(--ok); }
    .switch[aria-checked="true"]::after { transform: translateX(18px); }
    .switch[disabled] { opacity: 0.55; cursor: not-allowed; }
    .switch:focus-visible { outline: none; box-shadow: var(--focus); }
    .pref-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 4px; }
    .pref-btn {
      border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
      padding: 10px 8px; font-size: 13px; font-weight: 650; color: var(--ink-soft);
    }
    .pref-btn:hover { border-color: var(--line-strong); background: var(--bg); }
    .pref-btn:focus-visible { outline: none; box-shadow: var(--focus); }
    .pref-btn.active { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-ink); }
    .pref-btn.active.none { border-color: var(--ink); background: var(--ink); color: #fff; }
    .link-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px 0; }
    .card-grid { display: grid; gap: 10px; }
    .cat-card {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px; box-shadow: var(--shadow-soft); color: inherit;
    }
    .cat-card:hover { border-color: var(--line-strong); }
    .cat-card:focus-visible { outline: none; box-shadow: var(--focus); }
    .cat-card .grow { flex: 1; min-width: 0; }
    .cat-card .name { font-weight: 700; font-size: 16px; display: block; }
    .cat-card .meta { font-size: 13px; color: var(--muted); display: block; }
    .chev { color: var(--muted); }
    .backbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .log-list { display: flex; flex-direction: column; }
    .log-item {
      display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 12px 16px;
      border-bottom: 1px solid var(--line); font-size: 14px;
    }
    .log-item:last-child { border-bottom: 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; background: var(--brand-mid); }
    .dot.revoke { background: var(--danger); }
    .dot.give { background: var(--ok); }
    .dot.pref { background: var(--ink-soft); }
    .log-item time { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
    .settings { display: grid; gap: 16px; }
    .settings .panel { padding-bottom: 8px; }
    .id-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .id-table th, .id-table td { padding: 10px 16px; text-align: left; border-top: 1px solid var(--line); vertical-align: top; }
    .id-table th { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; border-top: 0; }
    .id-table .mono { font-family: var(--mono); font-weight: 650; font-size: 13px; }
    .bottom-nav {
      display: none; position: fixed; left: 0; right: 0; bottom: 0;
      height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--surface); border-top: 1px solid var(--line); z-index: 40;
    }
    .bottom-nav button {
      flex: 1; border: 0; background: none; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 650;
      color: var(--muted); padding: 8px 4px 6px;
    }
    .bottom-nav button.active { color: var(--brand); }
    .bottom-nav button:focus-visible { outline: none; box-shadow: inset var(--focus); }
    @media (max-width: 900px) {
      .bottom-nav { display: flex; }
      .desktop-only { display: none !important; }
      .shell { display: none; }
    }
    @media (min-width: 901px) {
      .mobile-only { display: none !important; }
      .bottom-nav { display: none !important; }
    }
    @media (max-width: 700px) {
      .intro { grid-template-columns: 1fr; padding: 16px; }
    }
    .overlay { display: none; }
    .overlay.open { display: block; }
    @media (min-width: 901px) {
      .overlay.open + .shell { display: none; }
      .overlay.open { margin-bottom: 20px; }
    }
    .toast {
      position: fixed; left: 50%; bottom: 24px;
      transform: translateX(-50%) translateY(16px);
      background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 12px;
      font-size: 14px; font-weight: 600; box-shadow: var(--shadow);
      opacity: 0; pointer-events: none; z-index: 80;
      max-width: min(520px, calc(100vw - 24px)); text-align: center;
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 900px) {
      .toast { bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }

    .terms-page { display: grid; gap: 16px; }
    .terms-hero {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow-soft); padding: 20px; display: grid; gap: 12px;
    }
    .terms-hero h3 { font-size: 18px; letter-spacing: -0.02em; }
    .terms-hero p { font-size: 14px; color: var(--ink-soft); max-width: 78ch; }
    .voorbeeld-tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--warn); background: var(--warn-bg); border: 1px solid var(--warn-line);
      border-radius: 999px; padding: 3px 9px;
    }
    .terms-hero .lead-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .btn-xl {
      width: 100%; padding: 16px 18px; font-size: 16px; border-radius: 12px;
      border: 1px solid var(--brand); background: var(--brand); color: #fff;
      box-shadow: var(--shadow-soft);
    }
    .btn-xl:hover { background: var(--brand-hover); }
    .btn-xl:focus-visible { outline: none; box-shadow: var(--focus); }
    .terms-org-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
    .terms-org-btn {
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px; box-shadow: var(--shadow-soft); color: inherit; font-weight: 700; font-size: 15px;
    }
    .terms-org-btn:hover { border-color: var(--line-strong); background: var(--bg); }
    .terms-org-btn:focus-visible { outline: none; box-shadow: var(--focus); }
    .terms-org-btn .cta { font-size: 13px; font-weight: 600; color: var(--brand); }
    .terms-sec-label {
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); margin: 8px 0 0;
    }
    .terms-report {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow-soft); overflow: hidden;
    }
    .terms-report + .terms-report { margin-top: 16px; }
    .terms-report .panel-h { padding: 16px 18px 12px; }
    .terms-block { padding: 14px 18px; border-top: 1px solid var(--line); }
    .terms-block h3 { font-size: 15px; margin-bottom: 8px; }
    .terms-block h4 { font-size: 13px; margin: 10px 0 6px; color: var(--brand-ink); }
    .terms-block p, .terms-block li { font-size: 14px; color: var(--ink-soft); }
    .terms-block ul { margin: 0; padding-left: 18px; }
    .terms-block li { margin: 4px 0; }
    .summary-box {
      background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    }
    .summary-box dl { margin: 0; display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; font-size: 14px; }
    .summary-box dt { color: var(--muted); font-weight: 650; }

    var PARTY_INDEX = null;
    function rebuildPartyIndex() {
      PARTY_INDEX = {};
      for (var orgId in ORG_THIRD_PARTIES) {
        var list = ORG_THIRD_PARTIES[orgId];
        for (var i = 0; i < list.length; i++) {
          PARTY_INDEX[list[i].id] = { party: list[i], orgId: orgId, firstLevel: true };
        }
      }
      for (var pid in ONWARD) {
        var kids = ONWARD[pid];
        for (var j = 0; j < kids.length; j++) {
          PARTY_INDEX[kids[j].id] = { party: kids[j], orgId: null, firstLevel: false, parentId: pid };
        }
      }
      function resolveOrg(id, guard) {
        var hit = PARTY_INDEX[id];
        if (!hit) return null;
        if (hit.orgId) return hit.orgId;
        if (!hit.parentId || (guard || 0) > 8) return null;
        hit.orgId = resolveOrg(hit.parentId, (guard || 0) + 1);
        return hit.orgId;
      }
      for (var id in PARTY_INDEX) resolveOrg(id, 0);
    }
    function partyById(id) {
      if (!PARTY_INDEX) rebuildPartyIndex();
      var hit = PARTY_INDEX[id];
      return hit ? hit.party : null;
    }
    function partyOrgOf(id) {
      if (!PARTY_INDEX) rebuildPartyIndex();
      var hit = PARTY_INDEX[id];
      return hit ? hit.orgId : null;
    }
    function childrenOf(id) { return ONWARD[id] || []; }
    function hasOnward(id) { return childrenOf(id).length > 0; }

    function dataFlowsOf(tp) {
      if (tp.dataFlows) return tp.dataFlows;
      if (tp.requiresLabel) return tp.requiresLabel;
      return "sector-specifieke identifier en de velden die jij aan hebt staan";
    }

    function isBlocked(orgId, partyId) {
      return !!(state.blocked && state.blocked[orgId + "::" + partyId]);
    }

    function isUnauthorized(tp) { return !!(tp && tp.violation); }

    function isFirstLevelShared(orgId, tp) {
      if (isUnauthorized(tp)) return !isBlocked(orgId, tp.id);
      return isThirdPartyShared(orgId, tp) && !isBlocked(orgId, tp.id);
    }

    function isOnwardShared(orgId, tp, parentShared) {
      if (isBlocked(orgId, tp.id)) return false;
      if (isUnauthorized(tp)) return true;
      return !!parentShared;
    }

    function currentChain(orgId) {
      if (state.chain && state.chain.orgId === orgId && state.chain.path && state.chain.path.length) return state.chain.path;
      return [];
    }

    function defaultRepFor(party) {
      if (REPUTATION[party.id]) return REPUTATION[party.id];
      var n = 0;
      for (var i = 0; i < party.id.length; i++) n = (n + party.id.charCodeAt(i) * (i + 3)) % 40;
      var score = 58 + (n % 28);
      return {
        score: score,
        label: score >= 75 ? "ruim voldoende" : score >= 60 ? "redelijk" : "matig",
        leaks: [],
        fines: [],
        news: ["In deze voorbeelddata zijn geen opvallende publieke boetes of datalekken bij deze partij opgenomen."],
        actions: []
      };
    }

    function countTree(orgId) {
      var first = ORG_THIRD_PARTIES[orgId] || [];
      var ids = {};
      var maxDepth = 1;
      var sharedCount = 0, unauth = 0, blocked = 0;
      function walk(list, depth, parentShared) {
        for (var i = 0; i < list.length; i++) {
          if (depth > maxDepth) maxDepth = depth;
          var tp0 = list[i];
          ids[tp0.id] = true;
          var blockedHere = isBlocked(orgId, tp0.id);
          var shared = depth === 1 ? isFirstLevelShared(orgId, tp0) : isOnwardShared(orgId, tp0, parentShared);
          if (blockedHere) blocked++;
          else if (shared) {
            sharedCount++;
            if (isUnauthorized(tp0)) unauth++;
          }
          walk(childrenOf(tp0.id), depth + 1, shared && !blockedHere);
        }
      }
      walk(first, 1, false);
      return { parties: Object.keys(ids).length, layers: first.length ? maxDepth : 0, shared: sharedCount, unauth: unauth, blocked: blocked };
    }

    function flattenTree(orgId) {
      var rows = [];
      function walk(list, depth, parentShared) {
        for (var i = 0; i < list.length; i++) {
          var tp0 = list[i];
          var blockedHere = isBlocked(orgId, tp0.id);
          var shared = depth === 1 ? isFirstLevelShared(orgId, tp0) : isOnwardShared(orgId, tp0, parentShared);
          rows.push({ party: tp0, depth: depth, shared: shared, blocked: blockedHere });
          walk(childrenOf(tp0.id), depth + 1, shared && !blockedHere);
        }
      }
      walk(ORG_THIRD_PARTIES[orgId] || [], 1, false);
      return rows;
    }

    function isThirdPartyShared(orgId, tp) {
      var st = state.orgs[orgId];
      if (!st || !st.active) return false;
      if (tp.requires && tp.requires.length) {
        for (var i = 0; i < tp.requires.length; i++) {
          if (!st.fields[tp.requires[i]]) return false;
        }
      }
      return true;
    }

    function fieldLabelsOn(orgId) {
      var org = orgById(orgId);
      var sec = sectorById(org.sector);
      var st = state.orgs[orgId];
      var on = [], off = [];
      var fields = sec.fields.slice();
      var hasBsn = false;
      for (var i = 0; i < fields.length; i++) if (fields[i].id === "bsn") hasBsn = true;
      if (!hasBsn) fields.push({ id: "bsn", label: "BSN", isBsn: true });
      for (var j = 0; j < fields.length; j++) {
        var f = fields[j];
        var locked = (f.isBsn || f.id === "bsn") && sec.bsnPolicy === "never";
        if (locked || !st.fields[f.id]) off.push(f.label);
        else on.push(f.label);
      }
      return { on: on, off: off };
    }

    function renderThirdParties(orgId) {
      var org = orgById(orgId);
      var path = currentChain(orgId);
      if (path.length) return renderChainView(org, path);
      var list = ORG_THIRD_PARTIES[orgId] || [];
      var yes = [], no = [], bad = [];
      for (var i = 0; i < list.length; i++) {
        var tp0 = list[i];
        var unauth = isUnauthorized(tp0) && !isBlocked(orgId, tp0.id);
        var consented = isThirdPartyShared(orgId, tp0) && !isBlocked(orgId, tp0.id) && !isUnauthorized(tp0);

        else if (consented) yes.push(tp0);
        else no.push(tp0);
      }
      var html = '<div class="terms-block" data-testid="third-parties-' + esc(orgId) + '">';
      html += '<h3>Derden: met wie data wél of niet is gedeeld</h3>';
      html += '<p>Dit volgt jouw huidige toestemmingen, plus voorbeeldmarkeringen van delen zonder akkoord. Tik op een partij onder “Wél gedeeld” of “Gedeeld zonder akkoord” om te zien aan wie zij de data vervolgens doorgeven. Zet een veld uit, of blokkeer een schakel: het is meteen van kracht en komt in de tijdlijn. Alle namen hieronder zijn voorbeelddata.</p>';
      html += renderTree(orgId, null);
      function listBlock(title, testid, arr, empty, clickable) {
        var h = '<h4>' + title + ' (' + arr.length + ')</h4>';
        if (!arr.length) h += '<p>' + empty + '</p>';
        else {
          h += '<div class="tp-list" data-testid="' + testid + '">';
          for (var y = 0; y < arr.length; y++) h += tpCard(org, arr[y], testid !== "tp-no", clickable);

      }
      html += listBlock("Wél gedeeld", "tp-yes", yes, "Op dit moment krijgt geen van de genoemde derden data van jou via deze organisatie, op grond van jouw toestemming.", true);
      html += listBlock("Gedeeld zonder akkoord", "tp-unauth", bad, "In deze voorbeelddata is bij deze organisatie geen deling zonder akkoord opgenomen.", true);
      html += listBlock("Niet gedeeld", "tp-no", no, "Alle genoemde derden krijgen nu data, volgens de velden die jij aan hebt staan, of staan onder “zonder akkoord”.", true);
      html += '<p style="margin-top:12px;font-size:13px;color:var(--muted)">Ook bij “Niet gedeeld” kun je doorklikken: je ziet dan aan wie die partij zou doorgeven als er wél data stroomde. Er wordt in die stand niets van jou doorgegeven, tenzij een voorbeeldovertreding is gemarkeerd.</p>';
      html += '</div>';

    }

    function pathForParty(orgId, partyId) {
      var parentOf = {};
      var first = ORG_THIRD_PARTIES[orgId] || [];
      function walk(list, parent) {
        for (var i = 0; i < list.length; i++) {
          parentOf[list[i].id] = parent;
          walk(childrenOf(list[i].id), list[i].id);
        }
      }
      walk(first, null);
      var path = [];
      var cur = partyId;
      var guard = 0;
      while (cur && guard++ < 8) {
        path.unshift(cur);
        cur = parentOf[cur];
      }
      return path;
    }

    function renderChainView(org, path) {
      var currentId = path[path.length - 1];
      var current = partyById(currentId);
      if (!current) return renderThirdPartiesReset(org.id);
      var parentShared = true;
      if (path.length === 1) {
        parentShared = isUnauthorized(current) ? !isBlocked(org.id, current.id) : (isThirdPartyShared(org.id, current) && !isBlocked(org.id, current.id));
      } else {
        var walkShared = isFirstLevelShared(org.id, partyById(path[0]));
        for (var i = 1; i < path.length; i++) {
          walkShared = isOnwardShared(org.id, partyById(path[i]), walkShared);
        }
        parentShared = walkShared;
      }
      var blocked = isBlocked(org.id, current.id);
      var shared = parentShared && !blocked;
      var kids = childrenOf(currentId);
      var html = '<div class="terms-block" data-testid="chain-view">';
      html += '<div class="crumbbar">';
      html += '<button type="button" class="btn btn-ghost" data-action="chain-back" data-org="' + esc(org.id) + '" data-testid="chain-back">← Terug</button>';
      html += '<nav class="crumbs" aria-label="Keten" data-testid="chain-crumb">';
      html += '<button type="button" data-action="chain-root" data-org="' + esc(org.id) + '">' + esc(org.name) + '</button>';
      for (var c = 0; c < path.length; c++) {
        var p = partyById(path[c]);
        html += '<span class="sep">›</span>';
        if (c === path.length - 1) html += '<span class="here">' + esc(p ? p.name : path[c]) + '</span>';
        else html += '<button type="button" data-action="chain-goto" data-org="' + esc(org.id) + '" data-depth="' + (c + 1) + '">' + esc(p ? p.name : path[c]) + '</button>';
      }
      html += '</nav></div>';
      html += renderTree(org.id, currentId);
      var cls = "tp-card " + (blocked ? "blocked" : (isUnauthorized(current) && shared ? "violation yes" : (shared ? "yes" : "no")));
      html += '<article class="' + cls + '" data-testid="chain-current">';
      html += '<div class="tp-top"><span class="tp-name">' + esc(current.name) + '</span>';
      html += blocked ? '<span class="badge badge-off">Geblokkeerd</span>' : (isUnauthorized(current) && shared ? '<span class="badge badge-warn">Gedeeld zonder akkoord</span>' : (shared ? '<span class="badge badge-ok">Wél data gedeeld</span>' : '<span class="badge badge-off">Niet gedeeld</span>'));
      html += '<span class="voorbeeld-tag">Voorbeelddata</span></div>';
      html += tpMeta(current);
      html += '<div class="tp-actions">' + blockButton(org, current) + '</div>';
      html += violationBlock(org, current);
      html += repuHtml(org, current, !!(state.repuOpen && state.repuOpen[current.id]));
      html += '</article>';
      html += '<h4 style="margin-top:16px">Volgende partijen waar deze partij data mee deelt</h4>';
      if (!kids.length) {
        html += '<div class="end-note" data-testid="deelt-niet-verder">Deze partij <strong>deelt niet verder</strong> volgens de voorbeelddata. Hier stopt deze tak van de keten.</div>';
      } else {
        var yes = [], no = [], bad = [];
        for (var k = 0; k < kids.length; k++) {
          var kid = kids[k];
          var kBlocked = isBlocked(org.id, kid.id);
          var kShared = isOnwardShared(org.id, kid, shared);
          if (isUnauthorized(kid) && kShared && !kBlocked) bad.push(kid);
          else if (kShared && !kBlocked) yes.push(kid);
          else no.push(kid);
        }
        if (yes.length) {
          html += '<h4>Wél gedeeld (' + yes.length + ')</h4><div class="tp-list">';
          for (var y = 0; y < yes.length; y++) html += tpCard(org, yes[y], true, true);
          html += '</div>';
        }
        if (bad.length) {
          html += '<h4>Gedeeld zonder akkoord (' + bad.length + ')</h4><div class="tp-list">';
          for (var b = 0; b < bad.length; b++) html += tpCard(org, bad[b], true, true);
          html += '</div>';
        }
        if (no.length) {
          html += '<h4>Niet gedeeld of geblokkeerd (' + no.length + ')</h4><div class="tp-list">';
          for (var n = 0; n < no.length; n++) html += tpCard(org, no[n], false, true);
          html += '</div>';
        }
      }
      html += realSourcesHtml();
      html += '</div>';
      return html;
    }

    function renderTermsAll() {

    function renderTermsOne(orgId) {
      var html = '<div class="terms-page" data-testid="terms-one-view">';

      html += renderOrgReport(orgId, false);

    function renderTerms() {
      var focus = state.termsFocus;
      if (focus === "all") return renderTermsAll();
      if (focus) return renderTermsOne(focus);
      return renderTermsLanding();
    }

    var state;
    var toastTimer = null;
    var lastRenderedView = null;

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function sectorById(id) {
      for (var i = 0; i < SECTORS.length; i++) if (SECTORS[i].id === id) return SECTORS[i];
      return SECTORS[0];
    }

    function orgById(id) {
      for (var i = 0; i < ORGS.length; i++) if (ORGS[i].id === id) return ORGS[i];
      return ORGS[0];
    }

    function fieldById(sector, fieldId) {
      for (var i = 0; i < sector.fields.length; i++) if (sector.fields[i].id === fieldId) return sector.fields[i];
      if (fieldId === "bsn") return { id: "bsn", label: "BSN", isBsn: true, defaultOn: false };
      return { id: fieldId, label: fieldId, defaultOn: false };
    }

    function defaultFields(sector) {
      var f = {};
      for (var i = 0; i < sector.fields.length; i++) f[sector.fields[i].id] = !!sector.fields[i].defaultOn;
      if (sector.bsnPolicy === "never") f.bsn = false;
      return f;
    }

    function defaultState() {
      var orgs = {};
      for (var i = 0; i < ORGS.length; i++) {
        var o = ORGS[i];
        var sec = sectorById(o.sector);
        orgs[o.id] = { active: !!o.defaultActive, fields: defaultFields(sec), pref: "email" };
      }
      var log = seedTimeline();
      log.unshift({
        id: "start",
        at: Date.now(),
        kind: "info",
        text: "Simulatie gestart voor " + CITIZEN + ". Bestaande koppelingen staan klaar; jij kunt ze meteen intrekken. De geschiedenis tot tien jaar terug is voorbeelddata."
      });
      var yearNow = eventYear(Date.now());
      var open = {};
      open[yearNow] = true;
      return {
        version: 2,
        introDismissed: false,
        selectedSector: "nuts",
        selectedOrg: "energie-a",
        view: "home",
        termsFocus: null,
        chain: null,
        repuOpen: {},
        blocked: {},
        joinedActions: {},
        tlFilterKind: "all",
        tlFilterOrg: "all",
        tlOpenYears: open,
        orgs: orgs,
        requests: [],
        log: log
      };
    }

    function loadState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        var migrated = false;
        var data = null;
        if (raw) {
          data = JSON.parse(raw);
        } else {
          var old = localStorage.getItem("hoe-het-wel-makkelijker-kan-v1");
          if (old) {
            data = JSON.parse(old);
            migrated = true;
          }
        }
        if (!data || !data.orgs) return defaultState();
        var base = defaultState();
        base.introDismissed = !!data.introDismissed;
        base.selectedSector = data.selectedSector || "nuts";
        base.selectedOrg = data.selectedOrg || "energie-a";
        base.view = data.view || "home";
        base.termsFocus = data.termsFocus || null;
        base.requests = Array.isArray(data.requests) ? data.requests : [];
        mergeOrgsFrom(data, base);
        if (data.version === 2 && Array.isArray(data.log) && data.log.length) {
          base.log = data.log;
        } else if (Array.isArray(data.log) && data.log.length) {
          var live = [];
          for (var i = 0; i < data.log.length; i++) {
            if (data.log[i] && data.log[i].id !== "start") live.push(data.log[i]);
          }
          base.log = live.concat(base.log);
        }
        if (data.blocked && typeof data.blocked === "object") base.blocked = data.blocked;
        if (data.joinedActions && typeof data.joinedActions === "object") base.joinedActions = data.joinedActions;
        if (data.tlFilterKind) base.tlFilterKind = data.tlFilterKind;
        if (data.tlFilterOrg) base.tlFilterOrg = data.tlFilterOrg;
        if (data.tlOpenYears && typeof data.tlOpenYears === "object") base.tlOpenYears = data.tlOpenYears;
        if (migrated) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(base)); } catch (e1) {}
        }
        return base;
      } catch (e) {
        return defaultState();
      }
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      catch (e) { /* private mode or quota — simulatie blijft werken tot herladen */ }
    }

    function formatTime(ts) {
      try {
        return new Intl.DateTimeFormat("nl-NL", {
          timeZone: "Europe/Amsterdam",
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(ts));
      } catch (e) {
        return new Date(ts).toLocaleString("nl-NL");
      }
    }

    function addLog(kind, text, extra) {
      var item = {
        id: "l" + Date.now() + Math.random().toString(16).slice(2),
        at: Date.now(),
        kind: kind,
        text: text,
        example: false
      };
      if (extra) {
        if (extra.orgId) item.orgId = extra.orgId;
        if (extra.partyId) item.partyId = extra.partyId;
        if (extra.articles) item.articles = extra.articles;
        if (extra.example) item.example = true;
      }
      state.log.unshift(item);
    }

    function showToast(msg) {
      var el = document.querySelector("[data-testid='toast']");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2800);
    }

    function isDesktop() {
      return window.matchMedia("(min-width: 901px)").matches;
    }

    function activeCount(sectorId) {
      var n = 0;
      for (var i = 0; i < ORGS.length; i++) {
        if (ORGS[i].sector === sectorId && state.orgs[ORGS[i].id].active) n++;
      }
      return n;
    }

    function orgsInSector(sectorId) {
      var list = [];
      for (var i = 0; i < ORGS.length; i++) if (ORGS[i].sector === sectorId) list.push(ORGS[i]);
      return list;
    }

    function pendingCount() {
      return state.requests.length;
    }

    function prefLabel(id) {
      for (var i = 0; i < PREFS.length; i++) if (PREFS[i].id === id) return PREFS[i].label;
      return id;
    }

    function toggleField(orgId, fieldId) {
      var org = orgById(orgId);
      var sec = sectorById(org.sector);
      var st = state.orgs[orgId];
      if (fieldId === "bsn" && sec.bsnPolicy === "never") return;
      var next = !st.fields[fieldId];
      st.fields[fieldId] = next;
      var field = fieldById(sec, fieldId);
      if (next && !st.active) {
        st.active = true;
        addLog("give", "Je koppelde " + org.name + " en gaf toestemming voor " + field.label.toLowerCase() + ".", { orgId: orgId });
        showToast("Gekoppeld en toestemming gegeven voor " + field.label.toLowerCase() + " — direct van kracht.");
      } else if (next) {
        addLog("give", "Je gaf " + org.name + " toestemming voor " + field.label.toLowerCase() + ".", { orgId: orgId });
        showToast("Toestemming voor " + field.label.toLowerCase() + " gegeven — direct van kracht.");
      } else {
        addLog("revoke", "Je trok bij " + org.name + " de toestemming voor " + field.label.toLowerCase() + " in.", { orgId: orgId });
        showToast("Toestemming voor " + field.label.toLowerCase() + " ingetrokken — direct van kracht.");
      }
      saveState();
      render();
    }

    function setPref(orgId, pref) {
      var org = orgById(orgId);
      state.orgs[orgId].pref = pref;
      addLog("pref", "Communicatievoorkeur voor " + org.name + ": " + prefLabel(pref).toLowerCase() + ".", { orgId: orgId });
      showToast("Voorkeur ingesteld: " + prefLabel(pref).toLowerCase() + " — direct van kracht.");
      saveState();
      render();
    }

    function setActive(orgId, active) {
      var org = orgById(orgId);
      state.orgs[orgId].active = active;
      if (active) {
        addLog("give", "Je koppelde " + org.name + ". De sector-specifieke identifier wordt gedeeld; verdere velden alleen als jij ze aanzet.", { orgId: orgId });
        showToast("Koppeling met " + org.name + " actief — direct van kracht.");
      } else {
        addLog("revoke", "Je trok de koppeling met " + org.name + " in. Er wordt niets meer gedeeld.", { orgId: orgId });
        showToast("Koppeling met " + org.name + " ingetrokken — direct van kracht.");
      }
      saveState();
      render();
    }

    function simulate(scenarioId) {
      var sc = null;
      for (var i = 0; i < SCENARIOS.length; i++) if (SCENARIOS[i].id === scenarioId) sc = SCENARIOS[i];
      if (!sc) return;
      for (var j = 0; j < state.requests.length; j++) {
        if (state.requests[j].scenarioId === scenarioId) {
          showToast("Die aanvraag staat al onder Openstaande aanvragen.");
          state.view = "requests";
          saveState();
          render();
          return;
        }
      }
      var org = orgById(sc.orgId);
      var sec = sectorById(org.sector);
      var selected = {};
      for (var k = 0; k < sec.fields.length; k++) {
        var f = sec.fields[k];
        selected[f.id] = f.isBsn ? false : !!f.defaultOn;
      }
      state.requests.unshift({
        id: "r" + Date.now(),
        scenarioId: sc.id,
        orgId: sc.orgId,
        title: sc.title,
        body: sc.body,
        at: Date.now(),
        selected: selected
      });
      addLog("request", "Nieuwe aanvraag van " + org.name + " verschenen onder Openstaande aanvragen.", { orgId: sc.orgId });
      showToast("Aanvraag van " + org.name + " staat klaar onder Openstaande aanvragen.");
      state.view = "requests";
      saveState();
      render();
    }

    function toggleRequestField(reqId, fieldId) {
      for (var i = 0; i < state.requests.length; i++) {
        if (state.requests[i].id === reqId) {
          var org = orgById(state.requests[i].orgId);
          var sec = sectorById(org.sector);
          if (fieldId === "bsn" && sec.bsnPolicy === "never") return;
          state.requests[i].selected[fieldId] = !state.requests[i].selected[fieldId];
          saveState();
          render();
          return;
        }
      }
    }

    function approveRequest(reqId) {
      var req = null, idx = -1;
      for (var i = 0; i < state.requests.length; i++) if (state.requests[i].id === reqId) { req = state.requests[i]; idx = i; }
      if (!req) return;
      var org = orgById(req.orgId);
      var sec = sectorById(org.sector);
      var st = state.orgs[req.orgId];
      st.active = true;
      var given = [];
      for (var k in req.selected) {
        if (k === "bsn" && sec.bsnPolicy === "never") { st.fields.bsn = false; continue; }
        st.fields[k] = !!req.selected[k];
        if (req.selected[k]) given.push(fieldById(sec, k).label.toLowerCase());
      }
      state.requests.splice(idx, 1);
      var what = given.length ? given.join(", ") : "alleen de sector-specifieke identifier";
      addLog("give", "Je willigde de aanvraag van " + org.name + " in en deelde: " + what + ".", { orgId: req.orgId });
      showToast("Aanvraag ingewilligd — direct van kracht.");
      state.selectedSector = org.sector;
      state.selectedOrg = org.id;
      state.view = "home";
      saveState();
      render();
    }

    function declineRequest(reqId) {
      var req = null, idx = -1;
      for (var i = 0; i < state.requests.length; i++) if (state.requests[i].id === reqId) { req = state.requests[i]; idx = i; }
      if (!req) return;
      var org = orgById(req.orgId);
      state.requests.splice(idx, 1);
      addLog("revoke", "Je weigerde de aanvraag van " + org.name + ". Er is niets extra gedeeld.", { orgId: req.orgId });
      showToast("Aanvraag geweigerd — er is niets extra gedeeld.");
      saveState();
      render();
    }

    function renderLog() {
      var items = filteredLog();

      html += '<option value="all"' + (state.tlFilterKind === "all" ? " selected" : "") + '>Alle types</option>';
      var kinds = ["give", "revoke", "share", "onward", "block", "unblock", "violation", "request", "pref", "reputation", "action", "info"];
      for (var k = 0; k < kinds.length; k++) {
        html += '<option value="' + kinds[k] + '"' + (state.tlFilterKind === kinds[k] ? " selected" : "") + '>' + esc(KIND_LABELS[kinds[k]]) + '</option>';
      }
      html += '</select></label>';
      html += '<label>Organisatie <select data-action="tl-org" data-testid="tl-org">';
      html += '<option value="all"' + (state.tlFilterOrg === "all" ? " selected" : "") + '>Alle organisaties</option>';
      for (var o = 0; o < ORGS.length; o++) {
        html += '<option value="' + esc(ORGS[o].id) + '"' + (state.tlFilterOrg === ORGS[o].id ? " selected" : "") + '>' + esc(ORGS[o].name) + '</option>';
      }
      html += '</select></label>';
      html += '<button type="button" class="btn btn-ghost" data-action="download-timeline" data-testid="download-timeline">Bewijs downloaden</button>';
      html += '</div>';
      var yearsPresent = [];
      var seenY = {};
      for (var i = 0; i < state.log.length; i++) {
        var y0 = eventYear(state.log[i].at);
        if (!seenY[y0]) { seenY[y0] = true; yearsPresent.push(y0); }
      }
      yearsPresent.sort(function (a, b) { return b - a; });
      html += '<div class="tl-years" data-testid="tl-years">';
      for (var y = 0; y < yearsPresent.length; y++) {
        var yr = yearsPresent[y];
        html += '<button type="button" class="yr' + (state.tlOpenYears && state.tlOpenYears[yr] ? " active" : "") + '" data-action="tl-jump" data-year="' + yr + '" data-testid="tl-year-' + yr + '">' + yr + '</button>';
      }
      html += '</div>';
      html += '<div class="tl-scroll" data-testid="timeline-scroll">';
      if (!items.length) {
        html += '<p class="empty-note" style="margin:16px">Geen gebeurtenissen voor deze filters.</p>';
      } else {
        var groups = [];
        var lastYear = null, lastMonth = null, curYear = null, curMonthItems = null;
        for (var n = 0; n < items.length; n++) {
          var it = items[n];
          var yy = eventYear(it.at);
          var mm = formatMonthLabel(it.at);
          if (yy !== lastYear) {
            curYear = { year: yy, months: [] };
            groups.push(curYear);
            lastYear = yy;
            lastMonth = null;
          }
          if (mm !== lastMonth) {
            curMonthItems = { label: mm, items: [] };
            curYear.months.push(curMonthItems);
            lastMonth = mm;
          }
          curMonthItems.items.push(it);
        }
        for (var g = 0; g < groups.length; g++) {
          var grp = groups[g];
          var open = !!(state.tlOpenYears && state.tlOpenYears[grp.year]);
          var count = 0;
          for (var m = 0; m < grp.months.length; m++) count += grp.months[m].items.length;
          html += '<div class="tl-year" id="jaar-' + grp.year + '">';
          html += '<button type="button" data-action="tl-toggle" data-year="' + grp.year + '" aria-expanded="' + (open ? "true" : "false") + '">' + grp.year + '<span>' + count + ' gebeurtenis' + (count === 1 ? "" : "sen") + (open ? " · inklappen" : " · openen") + '</span></button>';
          if (open) {
            html += '<div class="log-list">';
            for (var mo = 0; mo < grp.months.length; mo++) {
              html += '<div class="tl-month">' + esc(grp.months[mo].label) + '</div>';
              for (var z = 0; z < grp.months[mo].items.length; z++) {
                var item = grp.months[mo].items[z];
                var cls = item.kind || "";
                html += '<div class="log-item tl-item ' + esc(cls) + '"><span class="dot ' + esc(cls) + '"></span><div>';
                html += '<time datetime="' + esc(new Date(item.at).toISOString()) + '">' + esc(formatDay(item.at)) + (item.example ? " · voorbeelddata" : "") + " · " + esc(KIND_LABELS[item.kind] || item.kind) + '</time>';
                html += esc(item.text);
                if (item.articles && item.articles.length) {
                  var codes = [];
                  for (var a = 0; a < item.articles.length; a++) {
                    var art = LEGAL[item.articles[a]];
                    codes.push(art ? art.code : item.articles[a]);
                  }
                  html += '<span class="arts">' + esc(codes.join(" · ")) + '</span>';
                }
                html += '</div></div>';
              }
            }
            html += '</div>';
          }
          html += '</div>';
        }
      }
      html += '</div>';
      html += '<p style="font-size:13px;color:var(--muted)">Jaren blijven dicht, behalve het jaar dat je opent. Zo blijft scrollen licht, ook met tien jaar geschiedenis.</p>';
      html += '</section>';
      return html;
    }

              esc(pref.label) + '</button>';
          }
          html += '</div></div></div>';
        }
      }
      html += '</section>';
      html += '<section class="panel" style="padding:16px"><h2 style="font-size:18px;margin-bottom:8px">Simulatie</h2>';
      html += '<p style="font-size:14px;color:var(--ink-soft);margin-bottom:12px">Dit is een lokale demo. Niets gaat naar een echte organisatie. Met resetten verdwijnen jouw oefenacties uit deze browser.</p>';
      html += '<button type="button" class="btn btn-danger" data-action="reset" data-testid="reset">Simulatie resetten</button></section>';
      html += '</div>';
      return html;
    }

    function renderMobileHome() {
      var html = "";
      html += renderIntro();
      html += renderRequestsBlock(false);
      html += renderSimulate();
      html += '<div class="section-title"><h2>Jouw omgevingen</h2><p>Tik een sector aan</p></div>';
      html += '<div class="card-grid" data-testid="mobile-cards">';
      for (var i = 0; i < SECTORS.length; i++) {
        var s = SECTORS[i];
        var n = activeCount(s.id);
        var label = n === 1 ? "1 koppeling actief" : n + " koppelingen actief";
        html += '<button type="button" class="cat-card" data-action="select-sector" data-id="' + esc(s.id) +
          '" data-testid="card-' + esc(s.id) + '">';
        html += '<span class="sector-ico">' + icon(s.id) + '</span>';
        html += '<span class="grow"><span class="name">' + esc(s.name) + '</span><span class="meta">' + esc(label) + '</span></span>';
        html += '<span class="chev" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span></button>';
      }
      html += '</div>';
      return html;
    }

    function renderMobileSector() {
      var sec = sectorById(state.selectedSector);
      var html = '<div class="backbar"><button type="button" class="btn btn-ghost" data-action="nav" data-view="home">← Overzicht</button></div>';
      html += '<div class="section-title"><h2>' + esc(sec.name) + '</h2></div>';
      html += '<p class="notice" style="margin:0 0 12px">' + esc(sec.notice) + '</p>';
      html += '<div class="card-grid">';
      var list = orgsInSector(sec.id);
      for (var i = 0; i < list.length; i++) {
        var o = list[i];
        var st = state.orgs[o.id];
        html += '<button type="button" class="cat-card" data-action="select-org" data-id="' + esc(o.id) +
          '" data-testid="m-org-' + esc(o.id) + '">';
        html += '<span class="grow"><span class="name">' + esc(o.name) + '</span><span class="meta">Toestemmingen bekijken</span></span>';
        html += st.active ? '<span class="badge badge-ok">Actief</span>' : '<span class="badge badge-off">Niet gekoppeld</span>';
        html += '</button>';
      }
      html += '</div>';
      return html;
    }

    function renderMobileOrg() {
      var html = '<div class="backbar"><button type="button" class="btn btn-ghost" data-action="nav" data-view="sector">← ' +
        esc(sectorById(orgById(state.selectedOrg).sector).name) + '</button></div>';
      html += '<div class="panel">' + renderDetail(state.selectedOrg) + '</div>';
      return html;
    }

    function renderMobileConsents() {
      var html = '<div class="section-title"><h2>Toestemmingen</h2><button type="button" class="btn-text" data-action="nav" data-view="log">Tijdlijn</button></div>';
      html += '<p style="font-size:14px;color:var(--ink-soft);margin-bottom:12px">Alles wat nu gedeeld wordt, per organisatie. Intrekken is één tik.</p>';
      var any = false;
      for (var s = 0; s < SECTORS.length; s++) {
        var list = orgsInSector(SECTORS[s].id);
        var block = "";
        for (var j = 0; j < list.length; j++) {
          if (!state.orgs[list[j].id].active) continue;
          any = true;
          var o = list[j];
          var st = state.orgs[o.id];
          var parts = [];
          var sec = SECTORS[s];
          for (var k = 0; k < sec.fields.length; k++) {
            if (st.fields[sec.fields[k].id]) parts.push(sec.fields[k].label);
          }
          block += '<button type="button" class="cat-card" data-action="select-org" data-id="' + esc(o.id) + '">';
          block += '<span class="grow"><span class="name">' + esc(o.name) + '</span><span class="meta">' +
            esc(parts.length ? parts.join(" · ") : "alleen " + sec.idLabel) + '</span></span>';
          block += '<span class="badge badge-ok">Actief</span></button>';
        }
        if (block) {
          html += '<div class="section-title" style="margin-top:8px"><h2>' + esc(SECTORS[s].name) + '</h2></div>';
          html += '<div class="card-grid" style="margin-bottom:12px">' + block + '</div>';
        }
      }
      if (!any) html += '<p class="empty-note">Je deelt nu niets. Koppel een organisatie vanuit Home, of willig een aanvraag in.</p>';
      return html;
    }

    function renderOverlayChrome(title, inner) {
      var back = isDesktop()
        ? '<button type="button" class="btn btn-ghost" data-action="nav" data-view="home">← Terug naar omgevingen</button>'
        : '<button type="button" class="btn btn-ghost" data-action="nav" data-view="home">← Home</button>';
      return '<div class="overlay open" data-testid="overlay"><div class="backbar">' + back +
        '</div><div class="section-title"><h2>' + esc(title) + '</h2></div>' + inner + '</div>';
    }

    function updateChrome() {
      var n = pendingCount();
      var badges = document.querySelectorAll("[data-bind='request-count']");
      for (var i = 0; i < badges.length; i++) {
        badges[i].hidden = n === 0;
        badges[i].textContent = String(n);
      }
      var tabs = document.querySelectorAll(".bottom-nav button");
      var view = state.view;
      var tabView = "home";
      if (view === "consents" || view === "log") tabView = "consents";
      else if (view === "settings") tabView = "settings";
      else if (view === "terms") tabView = "terms";
      else tabView = "home";
      for (var t = 0; t < tabs.length; t++) {
        tabs[t].classList.toggle("active", tabs[t].getAttribute("data-view") === tabView);
      }
    }

    function render() {
      var root = document.getElementById("app");
      var html = "";
      var desktop = isDesktop();
      var view = state.view || "home";
      if (desktop) {
        if (view === "log") html += renderOverlayChrome("Tijdlijn", renderLog());
        else if (view === "settings") html += renderOverlayChrome("Instellingen", renderSettings());
        else if (view === "requests") html += renderOverlayChrome("Openstaande aanvragen", renderRequestsBlock(true) + renderSimulate());
        else if (view === "terms") html += renderOverlayChrome("Waar heb ik voor getekend?", renderTerms());
        else {
          html += renderIntro();
          html += renderRequestsBlock(false);
          html += renderSimulate();
          html += renderShell();
        }
      } else {
        if (view === "home") html += renderMobileHome();
        else if (view === "sector") html += renderMobileSector();
        else if (view === "org") html += renderMobileOrg();
        else if (view === "consents") html += renderMobileConsents();
        else if (view === "log") html += '<div class="backbar"><button type="button" class="btn btn-ghost" data-action="nav" data-view="consents">← Toestemmingen</button></div>' + renderLog();
        else if (view === "settings") html += renderSettings();
        else if (view === "requests") html += '<div class="backbar"><button type="button" class="btn btn-ghost" data-action="nav" data-view="home">← Home</button></div>' + renderRequestsBlock(true) + renderSimulate();
        else if (view === "terms") html += renderTerms();
        else html += renderMobileHome();
      }
      var keepScroll = lastRenderedView === view;
      var y = keepScroll ? window.scrollY : 0;
      var tlEl = document.querySelector("[data-testid='timeline-scroll']");
      var tlY = tlEl ? tlEl.scrollTop : 0;
      root.innerHTML = html;
      lastRenderedView = view;
      updateChrome();
      if (keepScroll) window.scrollTo(0, y);
      else window.scrollTo(0, 0);
      if (keepScroll && tlY) {
        var tlNew = document.querySelector("[data-testid='timeline-scroll']");
        if (tlNew) tlNew.scrollTop = tlY;
      }
    }

    function filteredLog() {
      var kind = state.tlFilterKind || "all";
      var org = state.tlFilterOrg || "all";
      var out = [];
      for (var i = 0; i < state.log.length; i++) {
        var item = state.log[i];
        if (kind !== "all" && item.kind !== kind) continue;
        if (org !== "all" && item.orgId !== org) continue;
        out.push(item);
      }
      return out;
    }
    function downloadTimeline() {
      var items = filteredLog();
      var lines = [];
      lines.push("Tijdlijn — Hoe het wél makkelijker kan");
      lines.push("Simulatieburger: " + CITIZEN);
      lines.push("Opgesteld: " + formatDay(Date.now()) + " (Europe/Amsterdam)");
      lines.push("Let op: gebeurtenissen met ‘Voorbeelddata’ zijn fictief. Dit bestand is bedoeld als oefenbewijs bij een melding, geen authentieke akte.");
      lines.push("");
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        lines.push("— " + formatDay(item.at) + (item.example ? " [voorbeelddata]" : ""));
        lines.push("  Type: " + (KIND_LABELS[item.kind] || item.kind));
        if (item.orgId) {
          var og = null;
          try { og = orgById(item.orgId); } catch (e) {}
          lines.push("  Organisatie: " + (og ? og.name : item.orgId));
        }
        lines.push("  " + item.text);
        if (item.articles && item.articles.length) {
          for (var a = 0; a < item.articles.length; a++) {
            var art = LEGAL[item.articles[a]];
            if (art) lines.push("  Artikel: " + art.code + " — " + art.title + " (" + art.href + ")");
          }
        }
        lines.push("");
      }
      var blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "tijdlijn-hoe-het-wel-makkelijker-kan.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showToast("Tijdlijn gedownload — ter onderbouwing van een melding.");
    }
    function setChain(orgId, path) {
      state.chain = path && path.length ? { orgId: orgId, path: path } : null;
      saveState();
      render();
    }
    function openChain(orgId, partyId) {
      var path = currentChain(orgId).slice();
      if (!path.length) path = pathForParty(orgId, partyId);
      else {
        var kids = childrenOf(path[path.length - 1]);
        var ok = false;
        for (var i = 0; i < kids.length; i++) if (kids[i].id === partyId) ok = true;
        if (ok) path.push(partyId);
        else path = pathForParty(orgId, partyId);
      }
      if (state.view !== "terms") {
        state.view = "terms";
        state.termsFocus = orgId;
      } else if (!state.termsFocus || state.termsFocus === "all") {
        /* keep all-overview, chain is per org */
      }
      setChain(orgId, path);
    }
    function blockOnward(orgId, partyId, on) {
      var org = orgById(orgId);
      var p = partyById(partyId);
      if (!p || p.blockable === false) return;
      if (!state.blocked) state.blocked = {};
      var key = orgId + "::" + partyId;
      if (on) {
        state.blocked[key] = true;
        addLog("block", "Je blokkeerde doorgifte naar " + p.name + " (via " + org.name + "). Direct van kracht.", { orgId: orgId, partyId: partyId });
        showToast("Doorgifte naar " + p.name + " geblokkeerd — direct van kracht.");
      } else {
        delete state.blocked[key];
        addLog("unblock", "Je hief de blokkade op voor " + p.name + " (via " + org.name + ").", { orgId: orgId, partyId: partyId });
        showToast("Blokkade voor " + p.name + " opgeheven — direct van kracht.");
      }
      saveState();
      render();
    }
    function openRepu(orgId, partyId) {
      if (!state.repuOpen) state.repuOpen = {};
      state.repuOpen[partyId] = true;
      var p = partyById(partyId);
      var org = orgById(orgId);
      addLog("reputation", "Reputatiecheck uitgevoerd voor " + (p ? p.name : partyId) + " (via " + org.name + ").", { orgId: orgId, partyId: partyId });
      showToast("Reputatiecheck uitgevoerd — voorbeelddata.");
      saveState();
      render();
    }
    function joinAction(actionId, orgId, partyId) {
      var act = CLASS_ACTIONS[actionId];
      if (!act) return;
      if (!state.joinedActions) state.joinedActions = {};
      state.joinedActions[actionId] = true;
      addLog("action", "Aangesloten bij collectieve actie (simulatie): " + act.title + ". Dit is geen echte aanmelding.", { orgId: orgId, partyId: partyId });
      showToast("In de simulatie aangesloten. In het echt gaat dat via de belangenorganisatie en het register.");
      saveState();
      render();
    }

    function onClick(e) {
      var t = e.target.closest("[data-action]");
      if (!t) return;
      var action = t.getAttribute("data-action");
      if (t.tagName === "INPUT" && t.type === "checkbox") return;
      if (action === "select-sector") {
        state.selectedSector = t.getAttribute("data-id");
        var first = orgsInSector(state.selectedSector)[0];
        if (first) state.selectedOrg = first.id;
        state.view = isDesktop() ? "home" : "sector";
        saveState(); render();
      } else if (action === "select-org") {
        state.selectedOrg = t.getAttribute("data-id");
        state.selectedSector = orgById(state.selectedOrg).sector;
        state.view = isDesktop() ? "home" : "org";
        saveState(); render();
      } else if (action === "toggle-field") {
        toggleField(t.getAttribute("data-org"), t.getAttribute("data-field"));
      } else if (action === "set-pref") {
        setPref(t.getAttribute("data-org"), t.getAttribute("data-pref"));
      } else if (action === "revoke") {
        setActive(t.getAttribute("data-id"), false);
      } else if (action === "link") {
        setActive(t.getAttribute("data-id"), true);
      } else if (action === "simulate") {
        simulate(t.getAttribute("data-id"));
      } else if (action === "approve") {
        approveRequest(t.getAttribute("data-id"));
      } else if (action === "decline") {
        declineRequest(t.getAttribute("data-id"));
      } else if (action === "nav") {
        state.view = t.getAttribute("data-view");
        if (state.view === "terms") { state.termsFocus = null; state.chain = null; }
        saveState(); render();
      } else if (action === "terms-focus") {
        state.view = "terms";
        var focusId = t.getAttribute("data-id");
        if (state.chain && focusId !== "all" && state.chain.orgId !== focusId) state.chain = null;
        state.termsFocus = focusId;
        saveState(); render();
      } else if (action === "terms-back") {
        state.view = "terms";
        state.termsFocus = null;
        state.chain = null;
        saveState(); render();
      } else if (action === "open-terms") {
        state.view = "terms";
        state.termsFocus = t.getAttribute("data-id");
        saveState(); render();
      } else if (action === "go-home") {
        state.view = "home";
        saveState(); render();
      } else if (action === "dismiss-intro") {
        state.introDismissed = true;
        saveState(); render();
      } else if (action === "reset") {
        resetSim();
      } else if (action === "chain-open") {
        openChain(t.getAttribute("data-org"), t.getAttribute("data-party"));
      } else if (action === "chain-back") {
        var orgB = t.getAttribute("data-org");
        var pathB = currentChain(orgB).slice();
        pathB.pop();
        setChain(orgB, pathB);
      } else if (action === "chain-root") {
        setChain(t.getAttribute("data-org"), []);
      } else if (action === "chain-goto") {
        var orgG = t.getAttribute("data-org");
        var depth = Number(t.getAttribute("data-depth") || "0");
        setChain(orgG, currentChain(orgG).slice(0, depth));
      } else if (action === "chain-jump") {
        var orgJ = t.getAttribute("data-org");
        setChain(orgJ, pathForParty(orgJ, t.getAttribute("data-party")));
      } else if (action === "block-onward") {
        blockOnward(t.getAttribute("data-org"), t.getAttribute("data-party"), true);
      } else if (action === "unblock-onward") {
        blockOnward(t.getAttribute("data-org"), t.getAttribute("data-party"), false);
      } else if (action === "repu-open") {
        openRepu(t.getAttribute("data-org"), t.getAttribute("data-party"));
      } else if (action === "join-action") {
        joinAction(t.getAttribute("data-id"), t.getAttribute("data-org"), t.getAttribute("data-party"));
      } else if (action === "download-timeline") {
        downloadTimeline();
      } else if (action === "tl-jump") {
        var yearJ = Number(t.getAttribute("data-year"));
        if (!state.tlOpenYears) state.tlOpenYears = {};
        state.tlOpenYears[yearJ] = true;
        state.view = "log";
        saveState();
        render();
        var elY = document.getElementById("jaar-" + yearJ);
        if (elY) elY.scrollIntoView({ block: "start" });
      } else if (action === "tl-toggle") {
        var yearT = Number(t.getAttribute("data-year"));
        if (!state.tlOpenYears) state.tlOpenYears = {};
        state.tlOpenYears[yearT] = !state.tlOpenYears[yearT];
        saveState();
        render();
      }
    }

    function onChange(e) {
      var kindSel = e.target.closest("[data-action='tl-kind']");
      if (kindSel) {
        state.tlFilterKind = kindSel.value || "all";
        saveState(); render();
        return;
      }
      var orgSel = e.target.closest("[data-action='tl-org']");
      if (orgSel) {
        state.tlFilterOrg = orgSel.value || "all";
        saveState(); render();
        return;
      }
      var t = e.target.closest("[data-action='toggle-req-field']");
      if (!t) return;
      toggleRequestField(t.getAttribute("data-req"), t.getAttribute("data-field"));
    }

    document.addEventListener("click", onClick);
    document.addEventListener("change", onChange);
    window.addEventListener("resize", function () { render(); });

    state = loadState();
    render();
  })();
  </script>
</body>
</html>
